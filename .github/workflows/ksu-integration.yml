name: Integrate KernelSU Next

on:
  push:
    branches:
      - "android@13"
    paths:
      - ".github/workflows/ksu-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    name: Integrate and build KernelSU Next
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add KernelSU Next legacy source
        run: |
          git submodule add -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout a54e4fa46c6cc25bcaa055cf14d790194beffed8
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

      - name: Apply Linux 4.4 manual hooks
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, data):
              Path(path).write_text(data)

          def replace_once(path, old, new):
              s = read(path)
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              write(path, s.replace(old, new, 1))

          def include_after(path, include_line):
              marker = include_line + "\n"
              replacement = marker + "#include <linux/kernelsu.h>\n"
              replace_once(path, marker, replacement)

          def insert_before_in_function(path, function_token, marker, insertion):
              s = read(path)
              start = s.find(function_token)
              if start < 0:
                  raise SystemExit(f"{path}: function token not found: {function_token}")
              pos = s.find(marker, start)
              if pos < 0:
                  raise SystemExit(f"{path}: marker not found after {function_token}: {marker!r}")
              s = s[:pos] + insertion + s[pos:]
              write(path, s)

          def replace_in_function(path, function_token, old, new):
              s = read(path)
              start = s.find(function_token)
              if start < 0:
                  raise SystemExit(f"{path}: function token not found: {function_token}")
              pos = s.find(old, start)
              if pos < 0:
                  raise SystemExit(f"{path}: target not found after {function_token}: {old!r}")
              s = s[:pos] + new + s[pos + len(old):]
              write(path, s)

          header = r'''#ifndef _LINUX_KERNELSU_H
          #define _LINUX_KERNELSU_H

          #include <linux/compiler.h>
          #include <linux/fs.h>
          #include <linux/types.h>
          #include <linux/uidgid.h>

          struct filename;
          struct stat;
          struct stat64;

          #ifdef CONFIG_KSU
          int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                  void *argv, void *envp, int *flags);
          int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                                   int *mode, int *flags);
          int ksu_handle_stat(int *dfd, const char __user **filename_user,
                              int *flags);
          void ksu_handle_sys_read(unsigned int fd);
          void ksu_handle_newfstat_ret(unsigned int *fd,
                                       struct stat __user **statbuf);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          void ksu_handle_fstat64_ret(unsigned long *fd,
                                      struct stat64 __user **statbuf);
          #endif
          int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
          int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
                                    void __user **arg);
          int ksu_handle_input_handle_event(unsigned int *type,
                                            unsigned int *code, int *value);
          #else
          static inline int ksu_handle_execveat(int *fd,
                                                struct filename **filename_ptr,
                                                void *argv, void *envp,
                                                int *flags)
          {
              return 0;
          }
          static inline int ksu_handle_faccessat(int *dfd,
                                                 const char __user **filename_user,
                                                 int *mode, int *flags)
          {
              return 0;
          }
          static inline int ksu_handle_stat(int *dfd,
                                            const char __user **filename_user,
                                            int *flags)
          {
              return 0;
          }
          static inline void ksu_handle_sys_read(unsigned int fd)
          {
          }
          static inline void ksu_handle_newfstat_ret(unsigned int *fd,
                                                      struct stat __user **statbuf)
          {
          }
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          static inline void ksu_handle_fstat64_ret(unsigned long *fd,
                                                     struct stat64 __user **statbuf)
          {
          }
          #endif
          static inline int ksu_handle_setresuid(uid_t ruid, uid_t euid,
                                                 uid_t suid)
          {
              return 0;
          }
          static inline int ksu_handle_sys_reboot(int magic1, int magic2,
                                                  unsigned int cmd,
                                                  void __user **arg)
          {
              return 0;
          }
          static inline int ksu_handle_input_handle_event(unsigned int *type,
                                                           unsigned int *code,
                                                           int *value)
          {
              return 0;
          }
          #endif

          #endif /* _LINUX_KERNELSU_H */
          '''
          # Strip YAML heredoc indentation introduced above.
          header = "\n".join(line[10:] if line.startswith("          ") else line
                             for line in header.splitlines()) + "\n"
          write("include/linux/kernelsu.h", header)

          include_after("fs/exec.c", "#include <linux/syscalls.h>")
          insert_before_in_function(
              "fs/exec.c", "static int do_execveat_common(",
              "\tchar *pathbuf = NULL;",
              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\n")

          include_after("fs/open.c", "#include <linux/syscalls.h>")
          insert_before_in_function(
              "fs/open.c", "SYSCALL_DEFINE3(faccessat,",
              "\tif (mode & ~S_IRWXO)",
              "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\n")

          include_after("fs/read_write.c", "#include <linux/syscalls.h>")
          insert_before_in_function(
              "fs/read_write.c", "SYSCALL_DEFINE3(read,",
              "\tstruct fd f = fdget_pos(fd);",
              "\tksu_handle_sys_read(fd);\n\n")

          include_after("fs/stat.c", "#include <linux/syscalls.h>")
          insert_before_in_function(
              "fs/stat.c", "SYSCALL_DEFINE4(newfstatat,",
              "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "\tksu_handle_stat(&dfd, &filename, &flag);\n\n")
          replace_in_function(
              "fs/stat.c", "SYSCALL_DEFINE2(newfstat,",
              "\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n",
              "\tif (!error) {\n\t\terror = cp_new_stat(&stat, statbuf);\n\t\tif (!error)\n\t\t\tksu_handle_newfstat_ret(&fd, &statbuf);\n\t}\n")
          replace_in_function(
              "fs/stat.c", "SYSCALL_DEFINE2(fstat64,",
              "\tif (!error)\n\t\terror = cp_new_stat64(&stat, statbuf);\n",
              "\tif (!error) {\n\t\terror = cp_new_stat64(&stat, statbuf);\n\t\tif (!error)\n\t\t\tksu_handle_fstat64_ret(&fd, &statbuf);\n\t}\n")

          include_after("kernel/reboot.c", "#include <linux/syscalls.h>")
          insert_before_in_function(
              "kernel/reboot.c", "SYSCALL_DEFINE4(reboot,",
              "\t/* We only trust the superuser with rebooting the system. */",
              "\tret = ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
              "\tif (ret)\n\t\treturn ret;\n\n")

          include_after("kernel/sys.c", "#include <linux/syscalls.h>")
          insert_before_in_function(
              "kernel/sys.c", "SYSCALL_DEFINE3(setresuid,",
              "\tstruct user_namespace *ns = current_user_ns();",
              "\tksu_handle_setresuid(ruid, euid, suid);\n\n")

          include_after("drivers/input/input.c", "#include <linux/rcupdate.h>")
          insert_before_in_function(
              "drivers/input/input.c", "void input_event(struct input_dev *dev,",
              "\tif (is_event_supported(type, dev->evbit, EV_MAX))",
              "\tksu_handle_input_handle_event(&type, &code, &value);\n\n")

          selinux = read("security/selinux/hooks.c")
          function_token = "static int check_nnp_nosuid("
          start = selinux.find(function_token)
          if start < 0:
              raise SystemExit("security/selinux/hooks.c: check_nnp_nosuid not found")
          extern_block = (
              "#ifdef CONFIG_KSU\n"
              "extern bool is_ksu_transition(const struct task_security_struct *old_tsec,\n"
              "                              const struct task_security_struct *new_tsec);\n"
              "#endif\n\n")
          selinux = selinux[:start] + extern_block + selinux[start:]
          start += len(extern_block)
          old = "\tif (new_tsec->sid == old_tsec->sid)\n\t\treturn 0; /* No change in credentials */\n"
          pos = selinux.find(old, start)
          if pos < 0:
              raise SystemExit("security/selinux/hooks.c: NNP transition anchor not found")
          new = old + (
              "\n#ifdef CONFIG_KSU\n"
              "\tif (is_ksu_transition(old_tsec, new_tsec))\n"
              "\t\treturn 0;\n"
              "#endif\n")
          selinux = selinux[:pos] + new + selinux[pos + len(old):]
          write("security/selinux/hooks.c", selinux)

          drivers_makefile = read("drivers/Makefile")
          if "obj-$(CONFIG_KSU) += kernelsu/" not in drivers_makefile:
              if not drivers_makefile.endswith("\n"):
                  drivers_makefile += "\n"
              drivers_makefile += "obj-$(CONFIG_KSU) += kernelsu/\n"
              write("drivers/Makefile", drivers_makefile)

          drivers_kconfig = read("drivers/Kconfig")
          source = 'source "drivers/kernelsu/Kconfig"'
          if source not in drivers_kconfig:
              pos = drivers_kconfig.rfind("\nendmenu")
              if pos < 0:
                  raise SystemExit("drivers/Kconfig: final endmenu not found")
              drivers_kconfig = drivers_kconfig[:pos] + "\n" + source + "\n" + drivers_kconfig[pos:]
              write("drivers/Kconfig", drivers_kconfig)

          defconfig_path = Path("arch/arm64/configs/hi3650_defconfig")
          defconfig = defconfig_path.read_text()
          for line in (
              "CONFIG_KSU=y\n",
              "CONFIG_KSU_MANUAL_HOOK=y\n",
              "# CONFIG_KSU_KPROBES_HOOK is not set\n",
          ):
              defconfig = defconfig.replace(line, "")
          if not defconfig.endswith("\n"):
              defconfig += "\n"
          defconfig += (
              "\n# KernelSU Next\n"
              "CONFIG_KSU=y\n"
              "CONFIG_KSU_MANUAL_HOOK=y\n"
              "# CONFIG_KSU_KPROBES_HOOK is not set\n")
          defconfig_path.write_text(defconfig)

          workflow = Path(".github/workflows/kernel-build.yml")
          wf = workflow.read_text()
          old = (
              "      - name: Checkout kernel source\n"
              "        uses: actions/checkout@v4\n")
          new = old + (
              "        with:\n"
              "          submodules: recursive\n")
          if wf.count(old) != 1:
              raise SystemExit("kernel-build.yml: checkout block not found exactly once")
          workflow.write_text(wf.replace(old, new, 1))
          PY

          git diff --check
          test -L drivers/kernelsu
          test "$(readlink drivers/kernelsu)" = "../KernelSU-Next/kernel"
          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/hi3650_defconfig
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' arch/arm64/configs/hi3650_defconfig
          grep -q '^# CONFIG_KPROBES is not set$' arch/arm64/configs/hi3650_defconfig

      - name: Commit integration locally
        run: |
          git add -A
          git status --short
          git commit -m "kernel: integrate KernelSU Next"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            perl \
            python3

      - name: Fetch GCC 4.9 toolchains
        run: |
          git clone --depth=1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$RUNNER_TEMP/gcc-arm64"
          git clone --depth=1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "$RUNNER_TEMP/gcc-arm"

      - name: Configure KernelSU kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          export CROSS_COMPILE="$RUNNER_TEMP/gcc-arm64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$RUNNER_TEMP/gcc-arm/bin/arm-linux-androideabi-"
          make O=out hi3650_defconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' out/.config; then
            echo "KernelSU kprobe hook unexpectedly enabled" >&2
            exit 1
          fi

      - name: Build integrated kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          export CROSS_COMPILE="$RUNNER_TEMP/gcc-arm64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$RUNNER_TEMP/gcc-arm/bin/arm-linux-androideabi-"
          make O=out -j"$(nproc)"
          test -s out/arch/arm64/boot/Image.gz

      - name: Finalize and push integration
        run: |
          git reset --hard HEAD
          git -C KernelSU-Next reset --hard
          git -C KernelSU-Next clean -fdx
          rm .github/workflows/ksu-integration.yml
          git add -A
          git commit --amend --no-edit
          git status --short
          git push origin HEAD:"android@13"
