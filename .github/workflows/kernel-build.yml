name: Kernel Build

on:
  push:
    branches:
      - "android@13"
  pull_request:
    branches:
      - "android@13"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build hi3650 kernel with KernelSU Next
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify KernelSU Next source integration
        run: python3 scripts/verify-kernelsu-next.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git libelf-dev libssl-dev perl python3

      - name: Fetch pinned GCC 4.9 toolchains
        run: |
          fetch_toolchain() {
            local repo="$1" revision="$2" destination="$3"
            git init "$destination"
            git -C "$destination" remote add origin "$repo"
            git -C "$destination" fetch --depth=1 origin "$revision"
            git -C "$destination" checkout --detach FETCH_HEAD
          }
          fetch_toolchain \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            5e030eafe024784a73cdf47e6936ac0dbfc763dc "$RUNNER_TEMP/gcc-arm64"
          fetch_toolchain \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            111258a10e017f067b27e6cfcea7619d753f3309 "$RUNNER_TEMP/gcc-arm"
          echo "CROSS_COMPILE=$RUNNER_TEMP/gcc-arm64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$RUNNER_TEMP/gcc-arm/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          make O=out hi3650_defconfig
          python3 scripts/verify-kernelsu-next.py --config out/.config

      - name: Build kernel
        run: |
          set -o pipefail
          make O=out -j"$(nproc)" Image.gz dtbs modules 2>&1 | tee kernel-build.log

      - name: Verify build outputs and source stability
        run: |
          python3 scripts/verify-kernelsu-next.py --out out
          git diff --exit-code
          git -C KernelSU-Next diff --exit-code

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hi3650-build-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
          path: |
            kernel-build.log
            out/.config

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hi3650-kernelsu-next-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/auto-generate/*.dtb
            out/System.map
            out/**/*.ko
