name: Kernel Build

on:
  push:
    branches:
      - "android@13"
  pull_request:
    branches:
      - "android@13"
  workflow_dispatch:

# Temporarily writable so the first integration run can persist the manual-hook
# source changes and the pinned KernelSU Next submodule. This is reverted to
# read-only after the integration commit lands.
permissions:
  contents: write

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build hi3650 kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            perl \
            python3

      - name: Integrate KernelSU Next
        run: bash scripts/integrate-kernelsu-next.sh

      - name: Persist KernelSU Next source integration
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .gitmodules \
            KernelSU-Next \
            drivers/kernelsu \
            drivers/Makefile \
            drivers/Kconfig \
            include/linux/kernelsu.h \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            kernel/sys.c \
            drivers/input/input.c \
            security/selinux/hooks.c \
            arch/arm64/configs/hi3650_defconfig

          if ! git diff --cached --quiet; then
            git commit -m "kernel: integrate KernelSU Next legacy"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Fetch GCC 4.9 toolchains
        run: |
          git clone --depth=1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$RUNNER_TEMP/gcc-arm64"
          git clone --depth=1 --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "$RUNNER_TEMP/gcc-arm"

      - name: Configure kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          export CROSS_COMPILE="$RUNNER_TEMP/gcc-arm64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$RUNNER_TEMP/gcc-arm/bin/arm-linux-androideabi-"
          make O=out hi3650_defconfig

      - name: Verify KernelSU configuration
        run: |
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config
          grep -q '^# CONFIG_KSU_KPROBES_HOOK is not set$' out/.config

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          export CROSS_COMPILE="$RUNNER_TEMP/gcc-arm64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$RUNNER_TEMP/gcc-arm/bin/arm-linux-androideabi-"
          make O=out -j"$(nproc)"

      - name: Verify build outputs
        run: |
          test -s out/arch/arm64/boot/Image.gz
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -print

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hi3650-kernelsu-next-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
            out/.config
